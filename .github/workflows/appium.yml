name: Appium Android Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Set once at job level so it's identical in every step that touches
      # Appium (install step AND the emulator-runner step). Previously this
      # was declared separately on two different steps — same value, but
      # fragile if one of them ever drifted.
      APPIUM_HOME: /home/runner/.appium

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v6

      # ── 2. Java ──────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Node.js ───────────────────────────────────────────────────────────
      #    Appium 3 requires Node >= 20.19, so pin a patch version that
      #    satisfies that instead of a bare major (which can drift).
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'

      # ── 4. KVM acceleration ───────────────────────────────────────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── 5. Appium + UiAutomator2 ─────────────────────────────────────────────
      #    `appium@latest` resolves to the current Appium 3.x line, which
      #    matches the uiautomator2 driver (v5+, Appium-3-only).
      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium@latest
          appium --version
          appium driver install uiautomator2
          appium driver list --installed

      # ── 6. Project dependencies ───────────────────────────────────────────────
      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      # ── 7. Make the test runner script executable ─────────────────────────────
      - name: Make run_tests.sh executable
        run: chmod +x run_tests.sh

      # ── 8. Run tests inside Android emulator ──────────────────────────────────
      #
      #    android-emulator-runner runs each line of `script:` as its own
      #    `/usr/bin/sh -c` call. Multi-line constructs like until...done and
      #    if...fi break with "Syntax error: end of file" under plain sh.
      #
      #    Solution: put ALL shell logic in run_tests.sh (committed to repo),
      #    and `script:` just calls it with bash. Bash runs the whole file as
      #    one process, so loops and conditionals work correctly.
      #
      #    FIX: run_tests.sh no longer passes `--base-path '/'` to appium —
      #    that flag was crashing the Appium process instantly on startup
      #    (before it ever opened appium.log), which is why every previous
      #    run just timed out waiting on port 4723 with no log to show for
      #    it. run_tests.sh also now checks the appium binary and fails fast
      #    with a clear error instead of silently timing out.
      - name: Run Appium tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis_playstore
          avd-name: test_avd
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-metrics
          disable-animations: true
          script: bash run_tests.sh

      # ── 9. Upload screenshots ─────────────────────────────────────────────────
      - name: Upload screenshots
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: |
            screenshot.png
            screenshot_1_launch.png
            screenshot_2_results.png
          if-no-files-found: warn
          retention-days: 14

      # ── 10. Upload Appium logs ────────────────────────────────────────────────
      - name: Upload Appium logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: appium-logs
          path: |
            appium.log
            appium_stdout.log
          if-no-files-found: warn
          retention-days: 14
